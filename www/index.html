<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Blindness Simulator</title>
<script async src="https://andrewmacheret.com/analytics.js"></script>
<meta name="description" content="See how photos look to people with different types of color blindness. A color blindness simulator that runs in your browser." />
<link rel="canonical" href="https://andrewmacheret.com/projects/colorblind/" />

<meta property="og:url" content="https://andrewmacheret.com/projects/colorblind/" />
<meta property="og:image" content="https://andrewmacheret.com/projects/colorblind/nature.jpg" />
<meta property="og:title" content="Color Blindness Simulator" />
<meta property="og:description" content="See how photos look to people with different types of color blindness." />
<meta property="og:type" content="website" />

<!-- bump ?v= when a file changes, so browsers don't mix it with an old cached copy -->
<script type="text/javascript" src="canvas.js?v=2"></script>
<script type="text/javascript" src="pixel.js?v=2"></script>
<script type="text/javascript" src="filters.js?v=2"></script>
<script type="text/javascript" src="colorblind.js?v=2"></script>

<link rel="stylesheet" type="text/css" href="colorblind.css?v=2">

</head>
<body>
<div id="body-wrapper">

<div id="header-wrapper">
  <h1>Color Blindness Simulator</h1>
</div>

<div id="filter-wrapper">
  <p>
    Remove filter:
    <button id="reset">Reset</button>
  </p>
  <p>
    Simulate color blindness:
    <button id="applyProtanopia">Protanopia</button>
    <button id="applyProtanomaly">Protanomaly</button>
    <button id="applyDeuteranopia">Deuteranopia</button>
    <button id="applyDeuteranomaly">Deuteranomaly</button>
    <button id="applyTritanopia">Tritanopia</button>
    <button id="applyTritanomaly">Tritanomaly</button>
    <button id="applyAchromatopsia">Achromatopsia</button>
    <button id="applyAchromatomaly">Achromatomaly</button>
  </p>
  <p>
    Other fun operations:
    <button id="removeConeL">Remove Cone L</button>
    <button id="removeConeM">Remove Cone M</button>
    <button id="removeConeS">Remove Cone S</button>
    <button id="grayscale">Grayscale</button>
    <button id="rotateRGB">Rotate RGB</button>
  </p>
</div>

<div id="load-wrapper">
  Choose a different image:
  <input id="image-file" type="file" />
</div>

<div id="canvas-wrapper">
  <canvas id="canvas" init="nature.jpg"></canvas>
</div>

</div>
</body>
</html>
