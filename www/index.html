<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>Color Blindness Simulator</title>
<script async src="https://andrewmacheret.com/analytics.js"></script>
<meta name="description" content="See how photos look to people with different types of color blindness. A color blindness simulator that runs in your browser." />
<link rel="canonical" href="https://andrewmacheret.com/projects/colorblind/" />

<meta property="og:url" content="https://andrewmacheret.com/projects/colorblind/" />
<meta property="og:image" content="https://andrewmacheret.com/projects/colorblind/screenshot.png" />
<meta property="og:title" content="Color Blindness Simulator" />
<meta property="og:description" content="See how photos look to people with different types of color blindness." />
<meta property="og:type" content="website" />

<script src="filters.js" defer></script>
<script src="colorblind.js" defer></script>

<link rel="stylesheet" type="text/css" href="colorblind.css">
</head>
<body>
<main class="app">
  <header class="header">
    <div>
      <h1>Color Blindness Simulator</h1>
      <p>See a photo the way people with color blindness see it.</p>
    </div>
    <div class="image-controls">
      <select id="image-choice" aria-label="Sample image">
        <option value="nature.jpg">Nature</option>
        <option value="bird.jpg">Birds</option>
        <option value="pencils.jpg">Colored pencils</option>
        <option value="jelly.png">Jellyfish</option>
        <option value="sky.jpg">Sky</option>
        <option value="redgreen.jpg">Color blindness test plate</option>
        <option value="simplecolorblindtest.png">Color chart</option>
      </select>
      <label class="control upload">
        <input id="image-file" type="file" accept="image/*">
        <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3.5M6 7l4-4 4 4M3.5 12.5v2a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Your image
      </label>
    </div>
  </header>

  <div class="layout">
    <section class="stage" id="stage">
      <div class="viewer" id="viewer">
        <canvas id="filtered"></canvas>
        <canvas id="original" aria-hidden="true"></canvas>
        <div class="divider" id="divider" role="slider" tabindex="0" aria-label="Compare with the original" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="50% original">
          <span class="handle">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5.5 3 10l4.5 4.5M12.5 5.5 17 10l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </div>
        <span class="tag tag-left" aria-hidden="true">Original</span>
        <span class="tag tag-right" id="filter-tag" aria-hidden="true"></span>
        <div class="drop-hint" aria-hidden="true">Drop an image to load it</div>
      </div>
      <p class="error" id="error" role="alert" hidden></p>
      <div class="caption">
        <div aria-live="polite">
          <h2 id="filter-name"></h2>
          <p id="filter-about"></p>
        </div>
        <button class="control small" id="save" type="button">
          <svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.5V13M6 9l4 4 4-4M3.5 12.5v2a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Save image
        </button>
      </div>
    </section>

    <aside class="panel" id="filters" aria-label="Filters"></aside>
  </div>

  <footer class="footer">
    <a href="https://andrewmacheret.com/">More projects</a>
    <span aria-hidden="true">&middot;</span>
    <a href="https://github.com/andrewmacheret/colorblind">Source</a>
  </footer>
</main>
</body>
</html>
